<svg xmlns="http://www.w3.org/2000/svg" viewBox="75 95 210 210" width="100%" height="100%">
  <defs>
    <linearGradient id="circleGradMark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>
  </defs>
  <g transform="translate(180, 200)">
    <!-- Faint Background Grid -->
    <path d="M-80,-40 L80,-40 M-80,40 L80,40 M-40,-80 L-40,80 M40,-80 L40,80" stroke="#1f2937" stroke-width="2" />
    
    <!-- Radar Circles -->
    <circle cx="0" cy="0" r="75" fill="none" stroke="url(#circleGradMark)" stroke-width="8" />
    <circle cx="0" cy="0" r="45" fill="none" stroke="#0ea5e9" stroke-width="3" opacity="0.6" />
    
    <!-- Crosshairs -->
    <line x1="-105" y1="0" x2="-75" y2="0" stroke="#3b82f6" stroke-width="6" stroke-linecap="round" />
    <line x1="75" y1="0" x2="105" y2="0" stroke="#10b981" stroke-width="6" stroke-linecap="round" />
    <line x1="0" y1="-105" x2="0" y2="-75" stroke="#10b981" stroke-width="6" stroke-linecap="round" />
    <line x1="0" y1="75" x2="0" y2="105" stroke="#3b82f6" stroke-width="6" stroke-linecap="round" />
    
    <!-- Orange Wobble Waveform -->
    <path d="M-90,0 L-60,0 L-40,-45 L-15,55 L10,-40 L35,45 L55,-25 L75,0 L90,0" fill="none" stroke="#f59e0b" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
